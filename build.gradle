plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36'
    id 'io.freefair.lombok' version '8.6'
}


version =minecraft_version + "-" + mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_name
}                                                          
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    main {
        java {
            exclude 'modernmods/modernfoundry/plugin/craftingtweaks/**'
            exclude 'modernmods/modernfoundry/plugin/jsonthings/**'
            exclude 'modernmods/modernfoundry/plugin/DietPlugin.java'
            exclude 'modernmods/modernfoundry/plugin/DummmmmmyPlugin.java'
            exclude 'modernmods/modernfoundry/plugin/ImmersiveEngineeringPlugin.java'
            exclude 'modernmods/modernfoundry/common/data/**'
            exclude 'modernmods/modernfoundry/fluids/data/**'
            exclude 'modernmods/modernfoundry/gadgets/data/**'
            exclude 'modernmods/modernfoundry/library/data/**'
            exclude 'modernmods/modernfoundry/shared/data/**'
            exclude 'modernmods/modernfoundry/world/data/**'
            exclude 'modernmods/modernfoundry/smeltery/data/Byproduct.java'
            exclude 'modernmods/modernfoundry/smeltery/data/FluidContainerTransferProvider.java'
            exclude 'modernmods/modernfoundry/smeltery/data/SmelteryRecipeProvider.java'
            exclude 'modernmods/modernfoundry/tables/data/**'
            exclude 'modernmods/modernfoundry/tools/data/ArmorModelProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/EnchantmentToModifierProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/FluidEffectProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/ModifierProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/ModifierRecipeProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/StationSlotLayoutProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/ToolDefinitionDataProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/ToolItemModelProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/ToolsRecipeProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/client/**'
            exclude 'modernmods/modernfoundry/tools/data/material/MaterialDataProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/material/MaterialRecipeProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/material/MaterialRenderInfoProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/material/MaterialStatsDataProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/material/MaterialTraitsDataProvider.java'
            exclude 'modernmods/modernfoundry/tools/data/material/TrimMaterialProvider.java'
        }
        resources {
            srcDirs "src/generated/resources"
            //But exclude the cache of the generated data from what gets built
            exclude '.cache'
            // exclude debug resources, they are for helping us make the mod, not for the actual mod
            exclude 'assets/modernfoundry/debug'
            // NeoForge 1.21 uses singular data pack directories. Keep the old
            // generated 1.20-style paths out of the runtime jar to avoid duplicates.
            exclude 'data/**/recipes/**'
            exclude 'data/**/advancements/**'
            exclude 'data/**/loot_tables/**'
            exclude 'data/**/tags/blocks/**'
            exclude 'data/**/tags/entity_types/**'
            exclude 'data/**/tags/fluids/**'
            exclude 'data/**/tags/items/**'
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

runs {
    // applies to all the run configs below
    configureEach {
        workingDirectory project.file('run')

        // Recommended logging data for a userdev environment
        systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP,CORE'

        // Recommended logging level for the console
        systemProperty 'forge.logging.console.level', 'debug'

        // IE uses mixins, remap their mixins to work in dev
        systemProperty 'mixin.env.remapRefMap', 'true'

        modSource project.sourceSets.main
    }

    client {
        //The below if statements are to add args to your gradle.properties file in user home
        // (DO NOT add them directly to the gradle.properties file for this project)
        // Setting the below properties allows use of your normal Minecraft account in the
        // dev environment including having your skin load. Each property also has a comment
        // explaining what information to set the value to/format it expects
        // One thing to note is because of the caching that goes on, after changing these
        // variables, you need to refresh the project and rerun genIntellijRuns/genEclipseRuns
        if (project.hasProperty('mc_uuid')) {
            //Your uuid without any dashes in the middle
            arguments.addAll '--uuid', project.getProperty('mc_uuid')
        }
        if (project.hasProperty('mc_username')) {
            //Your username/display name, this is the name that shows up in chat
            // Note: This is not your email, even if you have a Mojang account
            arguments.addAll '--username', project.getProperty('mc_username')
        }
        if (project.hasProperty('mc_accessToken')) {
            //Your access token, you can find it in your '.minecraft/launcher_profiles.json' file
            arguments.addAll '--accessToken', project.getProperty('mc_accessToken')
        }
    }

    server {
        argument '--nogui'
    }

    data {
        // This checkout ships its generated resources and has no active GatherDataEvent providers.
        // Keep NeoForge's stale-file cleanup out of the tracked source tree.
        arguments.addAll '--mod', 'modernfoundry', '--all', '--output', file("$buildDir/datagen/resources").getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'hilt'
    }
}

def verifyGeneratedTextures = tasks.register('verifyGeneratedTextures') {
    group = 'verification'
    description = 'Checks model texture namespaces and references against shipped texture files.'
    inputs.files(file('src/main/resources'), file('src/generated/resources'))

    doLast {
        def resourceRoots = [file('src/main/resources'), file('src/generated/resources')]
        def staleFiles = resourceRoots.collectMany { root ->
            fileTree(root).matching {
                include 'assets/tconstruct/**'
                include 'assets/modernfoundry/textures/**/*tconstruct*'
            }.files
        }
        if (!staleFiles.isEmpty()) {
            throw new GradleException("Stale tconstruct texture files found; use the active modernfoundry namespace:\n${staleFiles.take(12).join('\n')}")
        }

        def missing = new LinkedHashSet<String>()
        def staleReferences = new LinkedHashSet<String>()
        def collectTextureReferences
        collectTextureReferences = { value, textureContext, model ->
            if (value instanceof Map) {
                value.each { key, child ->
                    def name = key.toString()
                    collectTextureReferences(child, textureContext || name == 'textures' || name == 'texture' || name == 'particle' || name.startsWith('layer'), model)
                }
            } else if (value instanceof Collection) {
                value.each { child -> collectTextureReferences(child, textureContext, model) }
            } else if (textureContext && value instanceof String && !value.startsWith('#')) {
                def separator = value.indexOf(':')
                def namespace = separator >= 0 ? value.substring(0, separator) : 'minecraft'
                def texturePath = separator >= 0 ? value.substring(separator + 1) : value
                if (namespace == 'tconstruct') {
                    staleReferences.add("${model}: ${value}")
                } else if (namespace == 'modernfoundry') {
                    texturePath = texturePath.replaceFirst(/\.png$/, '')
                    def relativePath = "assets/modernfoundry/textures/${texturePath}.png"
                    if (!resourceRoots.any { new File(it, relativePath).isFile() }) {
                        missing.add("${model}: ${relativePath}")
                    }
                }
            }
        }

        resourceRoots.each { root ->
            fileTree(root).matching { include 'assets/modernfoundry/models/**/*.json' }.files.each { model ->
                try {
                    collectTextureReferences(new groovy.json.JsonSlurper().parse(model), false, model)
                } catch (Exception exception) {
                    throw new GradleException("Could not parse model JSON ${model}", exception)
                }
            }
        }
        if (!staleReferences.isEmpty()) {
            throw new GradleException("Stale tconstruct texture references found; use the active modernfoundry namespace:\n${staleReferences.take(20).join('\n')}")
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing ModernFoundry model textures:\n${missing.take(20).join('\n')}")
        }
    }
}

tasks.named('check').configure {
    dependsOn verifyGeneratedTextures
}

configurations {
    deployerJars
}

repositories {
    mavenCentral()
    maven {
        name 'NeoForge'
        url 'https://maven.neoforged.net/releases'
    }
    maven { // TOP
        name 'tterrag maven'
        url "https://maven.tterrag.com/"
    }
    maven { // CraftTweaker, Immersive Engineering, JEI
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
    }
    maven { // JSON Things
        name 'Dogforce Games'
        url 'https://www.dogforce-games.com/maven/'
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    def hiltJar = rootProject.file("libs/Hilt-${minecraft_version}-${hilt_version}.jar")
    if (!hiltJar.isFile()) {
        throw new GradleException("Missing ${hiltJar}; fetch the matching Hilt release JAR before building ModernFoundry")
    }
    implementation files(hiltJar)

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // implementation fg.deobf("mcjty.theoneprobe:TheOneProbe-${minecraft_base_version}:${minecraft_base_version}-${probe_version}")

    // compileOnly "blusunrize.immersiveengineering:ImmersiveEngineering:${minecraft_version}-${ie_version}"
    // runtimeOnly "curse.maven:MoonlightLib-499980:6000197"
    // implementation "curse.maven:MmmMmmMmmMmm-225738:5737040"
//    runtimeOnly fg.deobf("curse.maven:the-twilight-forest-227639:5468648")

    // compileOnly "curse.maven:diet-443570:4813904"

    // compileOnly "dev.gigaherz.jsonthings:JsonThings-${minecraft_version}:${json_things_version}"

    // compileOnly "curse.maven:balm-531761:5999476"
    // compileOnly "curse.maven:crafting-tweaks-233071:5623639"

    deployerJars 'org.apache.maven.wagon:wagon-ssh:2.2'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.8.2'
    testImplementation 'org.mockito:mockito-inline:4.2.0'
    testImplementation 'org.assertj:assertj-core:3.21.0'
}

test {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true'
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn verifyGeneratedTextures

    var replaceProperties = [
        'version': project.version,
        'loader_range': loader_range,
        'minecraft_range': minecraft_range,
        'neo_range': neo_range,
        'hilt_range': hilt_range,
        'hilt_version': hilt_version,
        'jei_range': jei_range,
        'json_things_range': json_things_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'net/**'

    manifest {
        attributes([
                "Specification-Title"     : "Modern Foundry",
                "Specification-Vendor"    : "Modern Mods",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Modern Mods",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

sourcesJar {
    exclude 'assets/**'
exclude 'data/**'
exclude 'pack.png'
exclude 'pack.mcmeta'
exclude 'META-INF/neoforge.mods.toml'
}

artifacts {
    archives sourcesJar
}

// verify the properties exist.. or initialize.
if (!project.hasProperty("keystore_location")) // keystore location
    ext.keystore_location = "."

if (!project.hasProperty("keystore_user_alias")) // keystore user alias
    ext.keystore_user_alias = ""
if (!project.hasProperty("sftp_username"))
    ext.sftp_username = ""
if (!project.hasProperty("sftp_key"))
    ext.sftp_key = ""
if (!project.hasProperty("keystore_user_password")) // keystore user pass
    ext.keystore_user_password = ""
if (System.getenv().KSK_PW != null)
    ext.keystore_user_password = System.getenv().KSK_PW


task("uploadJars", dependsOn: "build") {

    description = "uploads JARs"

    if (project.hasProperty("local_maven") || project.hasProperty("sftp_maven")) {
        apply plugin: 'maven'
        uploadArchives {
            repositories {
                if (project.hasProperty("local_maven")) {
                    mavenDeployer {
                        repository(url: "file://${local_maven}")
                    }
                }
                if (project.hasProperty("sftp_maven")) {
                    repositories.mavenDeployer {
                        configuration = configurations.deployerJars
                        repository(url: "sftp://${sftp_maven}") {
                            authentication(userName: "${sftp_username}", privateKey: "${sftp_key}")
                        }
                    }
                }
            }
        }
    }
}

