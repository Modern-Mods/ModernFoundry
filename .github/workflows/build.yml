name: Build and Release ModernFoundry

on:
  push:
    branches:
      - "Neo/1.21.1"
      - "Neo/26.1.2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ModernFoundry
        uses: actions/checkout@v4
        with:
          path: ModernFoundry
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrappers executable
        run: chmod +x ModernFoundry/gradlew

      - name: Read ModernFoundry version
        id: version
        working-directory: ModernFoundry
        shell: bash
        run: |
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          tag_lanzador="$(awk -F= '$1 == "tag_lanzador" { print $2; exit }' gradle.properties | tr -d '\r')"
          hilt_version="$(awk -F= '$1 == "hilt_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${mod_version}" >> "$GITHUB_OUTPUT"
          echo "jar=ModernFoundry/build/libs/ModernFoundry-${minecraft_version}-${mod_version}-${tag_lanzador}.jar" >> "$GITHUB_OUTPUT"
          echo "hilt_jar=Hilt-${minecraft_version}-${hilt_version}.jar" >> "$GITHUB_OUTPUT"

      - name: Fetch required Hilt release JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ModernFoundry/libs
          hilt_asset="$(gh api repos/Modern-Mods/Hilt/releases/latest --jq ".assets[] | select(.name == \"${{ steps.version.outputs.hilt_jar }}\") | .browser_download_url" | head -n 1)"
          test -n "$hilt_asset"
          curl --fail --location "$hilt_asset" --output "ModernFoundry/libs/${{ steps.version.outputs.hilt_jar }}"

      - name: Build ModernFoundry
        working-directory: ModernFoundry
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Verify ModernFoundry JAR
        run: |
          test -f "${{ steps.version.outputs.jar }}"
          echo "Built ${{ steps.version.outputs.jar }}"

      - name: Check for existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.release_tag }}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.release_tag }} already exists; skipping release creation."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ModernFoundry latest release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.release_tag }}" \
            "${{ steps.version.outputs.jar }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ModernFoundry ${{ steps.version.outputs.mod_version }}" \
            --generate-notes \
            --latest
