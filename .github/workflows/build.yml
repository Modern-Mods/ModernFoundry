name: Build and Release ModernFoundry

on:
  push:
    branches:
      - "Neo/1.21.1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ModernFoundry
        uses: actions/checkout@v4
        with:
          path: ModernFoundry
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ModernFoundry/gradlew

      - name: Read ModernFoundry version
        id: version
        working-directory: ModernFoundry
        shell: bash
        run: |
          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          mod_version="$(awk -F= '$1 == "mod_version" { print $2; exit }' gradle.properties | tr -d '\r')"
          tag_lanzador="$(awk -F= '$1 == "tag_lanzador" { print $2; exit }' gradle.properties | tr -d '\r')"
          hilt_version="$(awk -F= '$1 == "hilt_version" { print $2; exit }' gradle.properties | tr -d '\r')"

          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"
          echo "hilt_version=$hilt_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${mod_version}" >> "$GITHUB_OUTPUT"
          echo "jar=ModernFoundry/build/libs/ModernFoundry-${minecraft_version}-${mod_version}-${tag_lanzador}.jar" >> "$GITHUB_OUTPUT"
          echo "hilt_jar=ModernFoundry/libs/Hilt-${minecraft_version}-${hilt_version}.jar" >> "$GITHUB_OUTPUT"

      - name: Verify bundled Hilt JAR
        shell: bash
        run: |
          if [ ! -f "${{ steps.version.outputs.hilt_jar }}" ]; then
            echo "::error::Required Hilt JAR not found: ${{ steps.version.outputs.hilt_jar }}"
            echo "Contents of ModernFoundry/libs:"
            ls -la ModernFoundry/libs || true
            exit 1
          fi

          echo "Using bundled Hilt dependency:"
          echo "${{ steps.version.outputs.hilt_jar }}"

      - name: Build ModernFoundry
        working-directory: ModernFoundry
        run: ./gradlew clean build --no-daemon --console=plain

      - name: Verify ModernFoundry JAR
        shell: bash
        run: |
          if [ ! -f "${{ steps.version.outputs.jar }}" ]; then
            echo "::error::Expected ModernFoundry JAR was not created:"
            echo "${{ steps.version.outputs.jar }}"
            echo "Contents of ModernFoundry/build/libs:"
            ls -la ModernFoundry/build/libs || true
            exit 1
          fi

          echo "Built ${{ steps.version.outputs.jar }}"

      - name: Check for existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${{ steps.version.outputs.release_tag }}" \
            --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then

            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.release_tag }} already exists; skipping release creation."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish ModernFoundry latest release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.release_tag }}" \
            "${{ steps.version.outputs.jar }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ModernFoundry ${{ steps.version.outputs.mod_version }}" \
            --generate-notes \
            --latest